name: Site build + deploy (Cloudflare Pages)

# A caradvance.hu és a testvéroldalak buildje GitHub Actions-ön (4 CPU, nincs sor egymás után),
# majd feltöltés a Cloudflare Pages "caradvance-astro" projektbe (wrangler pages deploy).
# - main        → élő oldal (teljes build, minden ország)
# - develop     → dev.caradvance.hu (gyors build, build-run.mjs develop mód)
# - dev-<ország> → dev.caradvance.<ország> (egy-ország build)
# Ugyanarra az ágra érkező újabb push megszakítja a még futó régit (cancel-in-progress).
# A feltöltéshez kell a CLOUDFLARE_API_TOKEN titok (Cloudflare Pages: Edit); nélküle csak buildel.
on:
  push:
    branches: [main, develop, 'dev-*']
    # ezek nem részei a weboldalnak (külön worker / dokumentáció) — változásuk nem indít buildet
    paths-ignore:
      - 'docs/**'
      - 'ajanlatmotor/**'
      - 'belso-api/**'
      - 'caradvance-chatbot/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: caradvance-astro
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: caradvance-astro/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund --progress=false

      # fordítási gyorsítótár (tcache.mjs): az előző build lefordított oldalai — ami nem változott, nem fordítjuk újra
      - name: Restore translation cache
        uses: actions/cache/restore@v4
        with:
          path: caradvance-astro/.tcache
          key: tcache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            tcache-${{ github.ref_name }}-
            tcache-develop-

      # fájl-gyorsítótár (filecache.mjs): a letöltött autófotók és a PDF-hez konvertált JPEG-ek az előző buildből
      - name: Restore photo cache
        uses: actions/cache/restore@v4
        with:
          path: caradvance-astro/.fcache
          key: fcache-${{ github.ref_name }}-none
          restore-keys: |
            fcache-${{ github.ref_name }}-
            fcache-develop-

      - name: Prepare caches
        run: |
          rm -rf .tcache-old && if [ -d .tcache ]; then mv .tcache .tcache-old; fi
          rm -rf .fcache-old && if [ -d .fcache ]; then mv .fcache .fcache-old; fi

      # a build ~60 lépése mind végigolvassa és újraírja a ~1 GB-nyi HTML-t: memóriában (tmpfs) ez kb. negyedével gyorsabb, mint lemezen
      - name: Put dist in memory
        run: mkdir -p dist && sudo mount -t tmpfs -o size=8g,uid=$(id -u),gid=$(id -g) tmpfs dist && df -h dist

      - name: Build
        env:
          CF_PAGES_BRANCH: ${{ github.ref_name }}
          # a készlet-tábla hitelesített olvasása (lib/sheet-src.js); üresen a nyilvános címet használja
          GOOGLE_SHEETS_SA: ${{ secrets.GOOGLE_SHEETS_SA }}
          CA_TCACHE_DIR: .tcache
          CA_TCACHE_OLD: .tcache-old
          CA_FCACHE_DIR: .fcache
          CA_FCACHE_OLD: .fcache-old
        run: |
          nproc; free -g | head -2
          npm run build
          node inject-tracking.mjs dist
          echo "files: $(find dist -type f | wc -l)"
          # a fotó-gyorsítótár csak akkor mentődik újra, ha változott a tartalma (a kulcs a fájllista lenyomata)
          echo "FCACHE_KEY=$( (ls -R .fcache 2>/dev/null || true) | sha1sum | cut -c1-16)" >> "$GITHUB_ENV"
          du -sh .fcache 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e84516d81d24db0cc3081dc13c4deb57
        run: >
          npx --yes wrangler@4 pages deploy dist
          --project-name caradvance-astro
          --branch "${{ github.ref_name }}"
          --commit-hash "${{ github.sha }}"
          --commit-message "$(git log -1 --format=%s | head -c 300)"
          --commit-dirty=true

      # a feltöltés után mentjük, hogy ne késleltesse az élesítést
      - name: Save translation cache
        if: ${{ success() }}
        uses: actions/cache/save@v4
        with:
          path: caradvance-astro/.tcache
          key: tcache-${{ github.ref_name }}-${{ github.run_id }}

      - name: Save photo cache
        if: ${{ success() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: caradvance-astro/.fcache
          key: fcache-${{ github.ref_name }}-${{ env.FCACHE_KEY }}
