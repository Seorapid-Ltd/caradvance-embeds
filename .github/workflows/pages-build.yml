name: Site build + deploy (Cloudflare Pages)

# A caradvance.hu és a testvéroldalak buildje GitHub Actions-ön (4 CPU, nincs sor egymás után),
# majd feltöltés a Cloudflare Pages "caradvance-astro" projektbe (wrangler pages deploy).
# - main        → élő oldal (teljes build, minden ország)
# - develop     → dev.caradvance.hu (gyors build, build-run.mjs develop mód)
# - dev-<ország> → dev.caradvance.<ország> (egy-ország build)
# Ugyanarra az ágra érkező újabb push megszakítja a még futó régit (cancel-in-progress).
# A feltöltéshez kell a CLOUDFLARE_API_TOKEN titok (Cloudflare Pages: Edit); nélküle csak buildel.
on:
  push:
    branches: [main, develop, 'dev-*']
    # ezek nem részei a weboldalnak (külön worker / dokumentáció) — változásuk nem indít buildet
    paths-ignore:
      - 'docs/**'
      - 'ajanlatmotor/**'
      - 'belso-api/**'
      - 'caradvance-chatbot/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: caradvance-astro
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: caradvance-astro/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund --progress=false

      - name: Build
        env:
          CF_PAGES_BRANCH: ${{ github.ref_name }}
          # a készlet-tábla hitelesített olvasása (lib/sheet-src.js); üresen a nyilvános címet használja
          GOOGLE_SHEETS_SA: ${{ secrets.GOOGLE_SHEETS_SA }}
        run: |
          nproc; free -g | head -2
          npm run build
          node inject-tracking.mjs dist
          echo "files: $(find dist -type f | wc -l)"

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e84516d81d24db0cc3081dc13c4deb57
        run: >
          npx --yes wrangler@4 pages deploy dist
          --project-name caradvance-astro
          --branch "${{ github.ref_name }}"
          --commit-hash "${{ github.sha }}"
          --commit-message "$(git log -1 --format=%s | head -c 300)"
          --commit-dirty=true
